[package]
name = "takecell"
version = "0.1.1"
edition = "2024"

# `1.96.0` fixed a "bug in the language" which made moving dropped `ManuallyDrop<Box<...>>` UB.
# Such UB can be triggered from safe code using this crate, as it provides a safe API around
# `ManuallyDrop`.
#
# waffle: In `1.96.0` I fixed the issue, so starting from that version `takecell` is sound again :3
#
# See
# - https://github.com/WaffleLapkin/takecell/issues/3
# - https://github.com/WaffleLapkin/takecell/issues/5
rust-version = "1.96"

description = "A cell type which value can only be taken once"

readme = "./README.md"
documentation = "https://docs.rs/takecell"
repository = "https://github.com/wafflelapkin/takecell"

license = "MIT"

keywords = ["cell", "take"]
categories = ["concurrency", "no-std", "rust-patterns"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]

[dev-dependencies]
once_cell = "1.8.0"
